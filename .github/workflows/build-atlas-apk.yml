name: Build ATLAS Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ATLAS_Planet_Finder_v1.0_New_Project.zip"

          echo "Checking for project archive..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found: $ZIP_FILE"
            echo "ZIP files found in repository:"
            find . -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Archive found:"
          ls -lh "$ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Searching for Gradle project..."

          SETTINGS_FILE="$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found."
            echo "Extracted files and directories:"
            find extracted -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Gradle project found at: $PROJECT_DIR"
          echo "Project settings file: $SETTINGS_FILE"

          if [ ! -f "$PROJECT_DIR/gradlew" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Gradle project build file not found."
            exit 1
          fi

          echo "$PROJECT_DIR" > "$GITHUB_WORKSPACE/project_dir.txt"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(cat project_dir.txt)"
          cd "$PROJECT_DIR"

          echo "Building project in: $PWD"
          java -version
          gradle --version

          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated debug APK..."

          find extracted -type f \
            -path '*/build/outputs/apk/debug/*.apk' -print

          APK_COUNT="$(find extracted -type f \
            -path '*/build/outputs/apk/debug/*.apk' | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Build finished without a debug APK."
            exit 1
          fi

          echo "Verified $APK_COUNT debug APK file(s)."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Futurica-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
